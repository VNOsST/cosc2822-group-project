name: ESLint Check

on:
  push:
    branches-ignore:
    - 'dependabot/**'
    - 'staging'
    - 'production'
  pull_request:
  workflow_dispatch:


jobs:
  lint:
    name: ESLint Check
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.5"

    - name: Install dependencies
      run: bun install

    - name: Run ESLint
      run: bun lint

    - name: Comment on PR (if failed)
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '❌ ESLint check failed. Please run `bun lint` locally and fix the errors before pushing.'
          })

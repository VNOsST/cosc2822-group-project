AWSTemplateFormatVersion: "2010-09-09"
Description: CineCloud Frontend - ECS EC2 Infrastructure

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - staging
    - prod
    Description: Deployment environment

  # Cognito configuration (from backend stack outputs)
  CognitoRegion:
    Type: String
    Description: AWS Region for Cognito
    Default: ""

  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID from backend stack
    Default: ""

  CognitoClientId:
    Type: String
    Description: Cognito User Pool Client ID from backend stack
    Default: ""

  ApiEndpoint:
    Type: String
    Description: Backend API Gateway endpoint URL
    Default: ""

Conditions:
  HasCognitoRegion: !Not [ !Equals [ !Ref CognitoRegion, "" ] ]
  HasUserPoolId: !Not [ !Equals [ !Ref CognitoUserPoolId, "" ] ]
  HasClientId: !Not [ !Equals [ !Ref CognitoClientId, "" ] ]
  HasApiEndpoint: !Not [ !Equals [ !Ref ApiEndpoint, "" ] ]

Resources:
  # ========================================
  # SSM Parameter Store (auto-created)
  # ========================================

  CognitoRegionParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cinecloud/${Environment}/cognito/region
      Description: !Sub Cognito region for ${Environment} environment
      Type: String
      Value: !If [ HasCognitoRegion, !Ref CognitoRegion, !Ref AWS::Region ]
      Tags:
        Environment: !Ref Environment
        Application: cinecloud

  CognitoUserPoolIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cinecloud/${Environment}/cognito/user-pool-id
      Description: !Sub Cognito User Pool ID for ${Environment} environment
      Type: String
      Value: !If [ HasUserPoolId, !Ref CognitoUserPoolId, "PLACEHOLDER_UPDATE_ME" ]
      Tags:
        Environment: !Ref Environment
        Application: cinecloud

  CognitoClientIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cinecloud/${Environment}/cognito/client-id
      Description: !Sub Cognito Client ID for ${Environment} environment
      Type: String
      Value: !If [ HasClientId, !Ref CognitoClientId, "PLACEHOLDER_UPDATE_ME" ]
      Tags:
        Environment: !Ref Environment
        Application: cinecloud

  ApiEndpointParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cinecloud/${Environment}/api/endpoint
      Description: !Sub API Gateway endpoint for ${Environment} environment
      Type: String
      Value: !If [ HasApiEndpoint, !Ref ApiEndpoint, "PLACEHOLDER_UPDATE_ME" ]
      Tags:
        Environment: !Ref Environment
        Application: cinecloud

  # ========================================
  # VPC and Networking
  # ========================================

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
      - Key: Name
        Value: !Sub cinecloud-vpc-${Environment}
      - Key: Environment
        Value: !Ref Environment
      - Key: Application
        Value: cinecloud

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
      - Key: Name
        Value: !Sub cinecloud-igw-${Environment}
      - Key: Environment
        Value: !Ref Environment

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      MapPublicIpOnLaunch: true
      Tags:
      - Key: Name
        Value: !Sub cinecloud-public-subnet-1-${Environment}
      - Key: Environment
        Value: !Ref Environment

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      MapPublicIpOnLaunch: true
      Tags:
      - Key: Name
        Value: !Sub cinecloud-public-subnet-2-${Environment}
      - Key: Environment
        Value: !Ref Environment

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
      - Key: Name
        Value: !Sub cinecloud-public-rt-${Environment}
      - Key: Environment
        Value: !Ref Environment

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  SubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # ========================================
  # Security Groups
  # ========================================

  FrontendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub cinecloud-frontend-sg-${Environment}
      GroupDescription: Security group for CineCloud frontend ECS tasks
      VpcId: !Ref VPC
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 3000
        ToPort: 3000
        SourceSecurityGroupId: !Ref ALBSecurityGroup
        Description: Allow traffic from ALB
      Tags:
      - Key: Name
        Value: !Sub cinecloud-frontend-sg-${Environment}
      - Key: Environment
        Value: !Ref Environment

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub cinecloud-alb-sg-${Environment}
      GroupDescription: Security group for CineCloud Application Load Balancer
      VpcId: !Ref VPC
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 80
        ToPort: 80
        CidrIp: 0.0.0.0/0
        Description: Allow HTTP from anywhere
      Tags:
      - Key: Name
        Value: !Sub cinecloud-alb-sg-${Environment}
      - Key: Environment
        Value: !Ref Environment

  # ========================================
  # Application Load Balancer
  # ========================================

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub cinecloud-alb-${Environment}
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      SecurityGroups:
      - !Ref ALBSecurityGroup
      Subnets:
      - !Ref PublicSubnet1
      - !Ref PublicSubnet2
      Tags:
      - Key: Environment
        Value: !Ref Environment
      - Key: Application
        Value: cinecloud

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub cinecloud-tg-${Environment}
      Port: 3000
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Tags:
      - Key: Environment
        Value: !Ref Environment

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
      - Type: forward
        TargetGroupArn: !Ref ALBTargetGroup

  # ========================================
  # ECS Cluster
  # ========================================

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub cinecloud-frontend-${Environment}
      Tags:
      - Key: Environment
        Value: !Ref Environment
      - Key: Application
        Value: cinecloud

  # ========================================
  # EC2 Launch Template
  # ========================================

  ECSLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub cinecloud-frontend-lt-${Environment}
      LaunchTemplateData:
        ImageId: !Sub "{{resolve:ssm:/aws/service/ecs/optimized-ami/amazon-linux-2023/recommended/image_id}}"
        InstanceType: t3.micro
        IamInstanceProfile:
          Name: LabInstanceProfile
        SecurityGroupIds:
        - !Ref FrontendSecurityGroup
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            echo ECS_CLUSTER=${ECSCluster} >> /etc/ecs/ecs.config
        TagSpecifications:
        - ResourceType: instance
          Tags:
          - Key: Name
            Value: !Sub cinecloud-frontend-instance-${Environment}
          - Key: Environment
            Value: !Ref Environment

  # ========================================
  # Auto Scaling Group
  # ========================================

  ECSAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub cinecloud-frontend-asg-${Environment}
      LaunchTemplate:
        LaunchTemplateId: !Ref ECSLaunchTemplate
        Version: !GetAtt ECSLaunchTemplate.LatestVersionNumber
      MinSize: 2
      MaxSize: 4
      DesiredCapacity: 2
      VPCZoneIdentifier:
      - !Ref PublicSubnet1
      - !Ref PublicSubnet2
      HealthCheckType: EC2
      HealthCheckGracePeriod: 300
      Tags:
      - Key: Name
        Value: !Sub cinecloud-frontend-asg-${Environment}
        PropagateAtLaunch: true
      - Key: Environment
        Value: !Ref Environment
        PropagateAtLaunch: true

  # ========================================
  # ECS Capacity Provider
  # ========================================

  ECSCapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      Name: !Sub cinecloud-frontend-cp-${Environment}
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref ECSAutoScalingGroup
        ManagedScaling:
          Status: ENABLED
          TargetCapacity: 100
        ManagedTerminationProtection: DISABLED

  ECSClusterCapacityProviderAssociation:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !Ref ECSCluster
      CapacityProviders:
      - !Ref ECSCapacityProvider
      DefaultCapacityProviderStrategy:
      - CapacityProvider: !Ref ECSCapacityProvider
        Weight: 1

  # ========================================
  # CloudWatch Logs
  # ========================================

  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/cinecloud-frontend-${Environment}
      RetentionInDays: 7

  # ========================================
  # ECS Task Definition
  # ========================================

  FrontendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub cinecloud-frontend-${Environment}
      NetworkMode: bridge
      RequiresCompatibilities:
      - EC2
      ExecutionRoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      TaskRoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      ContainerDefinitions:
      - Name: frontend
        # Uses shared ECR repo with environment-prefixed tags (e.g., dev-latest, prod-abc123)
        Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/cinecloud-frontend:${Environment}-latest"
        Essential: true
        PortMappings:
        - ContainerPort: 3000
          HostPort: 3000
          Protocol: tcp
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref FrontendLogGroup
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: frontend
        Environment:
        - Name: NODE_ENV
          Value: production
        - Name: PORT
          Value: "3000"
        Memory: 512

  # ========================================
  # ECS Service
  # ========================================

  FrontendService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: !Sub cinecloud-frontend-${Environment}
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref FrontendTaskDefinition
      DesiredCount: 1 # Start at 0 - GitHub Actions will scale up after first image push
      LaunchType: EC2
      LoadBalancers:
      - ContainerName: frontend
        ContainerPort: 3000
        TargetGroupArn: !Ref ALBTargetGroup
      HealthCheckGracePeriodSeconds: 60
      Tags:
      - Key: Environment
        Value: !Ref Environment
      - Key: Application
        Value: cinecloud

Outputs:
  LoadBalancerDNS:
    Description: DNS name of the Application Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancerDNS"

  LoadBalancerURL:
    Description: URL of the Application Load Balancer
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"

  ECSClusterName:
    Description: Name of the ECS Cluster
    Value: !Ref ECSCluster
    Export:
      Name: !Sub "${AWS::StackName}-ECSClusterName"

  ECSServiceName:
    Description: Name of the ECS Service
    Value: !GetAtt FrontendService.Name
    Export:
      Name: !Sub "${AWS::StackName}-ECSServiceName"

  SSMParameterPrefix:
    Description: Prefix for SSM parameters
    Value: !Sub /cinecloud/${Environment}

  VPCId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub "${AWS::StackName}-VPCId"

  PublicSubnet1Id:
    Description: Public Subnet 1 ID
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet1Id"

  PublicSubnet2Id:
    Description: Public Subnet 2 ID
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet2Id"
